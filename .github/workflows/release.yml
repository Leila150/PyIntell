name: Publish PyIntell to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Build and publish PyIntell distribution
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/PyIntell

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Publish PyIntell to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
