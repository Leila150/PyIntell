name: Migrate to src layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move package into src layout
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "src/pymodel/__init__.py" ]; then
            echo "src/pymodel already exists; nothing to move."
            exit 0
          fi

          if [ ! -d "pymodel" ]; then
            echo "Expected pymodel/ package directory was not found."
            exit 1
          fi

          mkdir -p src
          git mv pymodel src/pymodel

          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          old = '[tool.setuptools.packages.find]\ninclude = ["pymodel*"]'
          new = '[tool.setuptools.packages.find]\nwhere = ["src"]\ninclude = ["pymodel*"]'

          if old in text:
              text = text.replace(old, new)
          elif 'where = ["src"]' not in text:
              raise SystemExit("Could not locate setuptools package discovery configuration")

          path.write_text(text)
          PY

      - name: Verify package layout and metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f src/pymodel/__init__.py
          grep -Eq '^name = "pymodel-ai"$' pyproject.toml
          grep -Eq '^where = \["src"\]$' pyproject.toml
          grep -Eq '^include = \["pymodel\*"\]$' pyproject.toml

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes needed."
            exit 0
          fi
          git commit -m "refactor: move pymodel into src layout"
          git push
