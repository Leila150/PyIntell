name: Migrate to src layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !hashFiles('src/pymodel/__init__.py') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move package into src layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          git mv pymodel src/pymodel
          python - <<'PY'
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text()
          text = text.replace('include = ["pymodel*"]', 'where = ["src"]\ninclude = ["pymodel*"]')
          path.write_text(text)
          PY

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pymodel pyproject.toml
          if git diff --cached --quiet; then
            echo "No migration changes needed."
            exit 0
          fi
          git commit -m "refactor: move package into src layout"
          git push
