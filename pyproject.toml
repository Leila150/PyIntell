[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymodel"
version = "0.1.0"
description = "A modular Python framework for building AI models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
include = ["pymodel*"]
